name: Build and deploy

# The workflow Azure generates for you does two things: build and deploy.
# This one adds the gates in between. An AI-assisted project ships more
# small changes than a hand-written one, so the pipeline is where you
# enforce that "it looked fine" is not the only evidence a change works.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Verify and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          # Must match .nvmrc. Version drift between your machine and CI
          # produces the most confusing class of "works locally" bug.
          node-version-file: '.nvmrc'
          cache: 'npm'

      # `npm ci` not `npm install`: installs exactly the lockfile, and
      # fails if package.json and the lockfile disagree.
      - name: Install dependencies
        run: npm ci

      # --- Gates. Each is cheap and each catches a different failure. ---

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      # When e2e fails, the log gives you an assertion message and nothing
      # else. playwright.config.ts records a trace on first retry -- but the
      # traces are written to the runner's disk and thrown away with it
      # unless they are uploaded. Without this step a CI-only failure is
      # very hard to investigate.
      #   npx playwright show-trace <downloaded>/trace.zip
      - name: Upload Playwright traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      # The gate the portraits needed and did not have.
      #
      # Every step above this one runs against the DEV SERVER, where Vite
      # injects the stylesheet into the document. That hides a whole class of
      # bug: anything whose behaviour depends on assets being bundled into
      # /assets/ and served as real files. The HUD portraits shipped blank to
      # production with all of the gates above green.
      #
      # No continue-on-error. This is a gate, not evidence.
      - name: Built-output smoke test
        run: npm run e2e:dist

      # Screenshots are captured as a build artifact rather than asserted
      # on. Visual judgement stays human (or model) work -- but having the
      # PNGs attached to every run means you can diff a regression after
      # the fact without reproducing it locally.
      - name: Capture reference screenshots
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          BASE_URL=http://localhost:4173 npm run shots
        continue-on-error: true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ github.sha }}
          path: shots/
          retention-days: 14
          # This step runs with `always()`, so it also fires when an earlier
          # gate failed and the screenshot step never ran. Without this it
          # emits a confusing "No files were found" warning that looks like
          # a second failure rather than a consequence of the first.
          if-no-files-found: ignore

      # --- Deploy. Only reached if every gate above passed. ---

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          # The gates above already built and verified everything, so Oryx
          # must not build it a second time with its own toolchain.
          skip_app_build: true
          skip_api_build: true
          # With skip_app_build: true, app_location IS the built-output
          # folder and output_location must be empty. Using
          # app_location: '/' + output_location: 'dist' is the common
          # mistake -- it uploads the repo root instead of the build.
          app_location: 'dist'
          output_location: ''

  close_preview:
    # Tears down the temporary preview environment when a PR closes.
    # Free tier allows three at a time, so leaking them will block you.
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'
